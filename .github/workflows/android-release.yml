name: Android Release
run-name: Android Release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish · ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must be vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi

          # Mirror app/build.gradle.kts deriveVersionCode
          if [[ "$TAG_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.([0-9]+))?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            BETA="${BASH_REMATCH[5]:-}"
            CORE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            if [ -n "$BETA" ]; then
              VERSION_CODE=$((CORE * 1000 + BETA))
            else
              VERSION_CODE=$((CORE * 1000 + 999))
            fi
          fi

          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$FILE_VERSION" ]; then
            echo "::error::VERSION file is empty or missing."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match VERSION file (${FILE_VERSION})."
            echo "::error::Bump VERSION and commit before tagging."
            exit 1
          fi

          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME} version=${TAG_VERSION} versionCode=${VERSION_CODE}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONEPULSE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHONEPULSE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PHONEPULSE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONEPULSE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret PHONEPULSE_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          for name in STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret PHONEPULSE_${name} is missing."
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/phonepulse-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "KEYSTORE_PATH=${KEYSTORE_PATH}"
            echo "STORE_PASSWORD=${STORE_PASSWORD}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}"
            echo "VERSION_NAME=${VERSION}"
            echo "VERSION_CODE=${VERSION_CODE}"
          } >> "$GITHUB_ENV"
          echo "Restored keystore to ${KEYSTORE_PATH}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build signed release AAB
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          APK_SRC="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          AAB_SRC="$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -f "$APK_SRC"
          test -f "$AAB_SRC"
          APK_NAME="phonepulse-${VERSION}-release.apk"
          AAB_NAME="phonepulse-${VERSION}-release.aab"
          cp "$APK_SRC" "artifacts/android/${APK_NAME}"
          cp "$AAB_SRC" "artifacts/android/${AAB_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "AAB_NAME=${AAB_NAME}" >> "$GITHUB_ENV"
          ls -lh artifacts/android/

      - name: Verify APK version metadata
        run: |
          set -euo pipefail
          AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found at ${AAPT2}."
            exit 1
          fi
          APK="artifacts/android/${APK_NAME}"
          BADGING="$("$AAPT2" dump badging "$APK" | head -n 1)"
          APK_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          APK_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          if [ "$APK_VERSION_NAME" != "$VERSION" ]; then
            echo "::error::APK versionName ${APK_VERSION_NAME} does not match ${VERSION}."
            exit 1
          fi
          if [ "$APK_VERSION_CODE" != "$VERSION_CODE" ]; then
            echo "::error::APK versionCode ${APK_VERSION_CODE} does not match ${VERSION_CODE}."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android/phonepulse-*-release.apk
            artifacts/android/phonepulse-*-release.aab
