name: Android Manual Build

on:
  workflow_dispatch:
    inputs:
      format:
        description: '产物类型 (apk, aab, all)'
        required: true
        type: choice
        options:
          - apk
          - aab
          - all
        default: apk

concurrency:
  group: android-manual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONEPULSE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHONEPULSE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PHONEPULSE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONEPULSE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret PHONEPULSE_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          for name in STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret PHONEPULSE_${name} is missing."
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/phonepulse-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "KEYSTORE_PATH=${KEYSTORE_PATH}"
            echo "STORE_PASSWORD=${STORE_PASSWORD}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed APK
        if: ${{ inputs.format == 'apk' || inputs.format == 'all' }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build signed AAB
        if: ${{ inputs.format == 'aab' || inputs.format == 'all' }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [ "${{ inputs.format }}" = "apk" ] || [ "${{ inputs.format }}" = "all" ]; then
            APK_SRC="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
            test -f "$APK_SRC"
            cp "$APK_SRC" "artifacts/android/phonepulse-${VERSION}-release.apk"
          fi
          if [ "${{ inputs.format }}" = "aab" ] || [ "${{ inputs.format }}" = "all" ]; then
            AAB_SRC="$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
            test -f "$AAB_SRC"
            cp "$AAB_SRC" "artifacts/android/phonepulse-${VERSION}-release.aab"
          fi
          ls -lh artifacts/android/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phonepulse-${{ github.ref_name }}-${{ inputs.format }}-${{ github.run_id }}
          path: artifacts/android/*
          retention-days: 14
